# ansible-log-mcp configuration
# Copy to config.local.yaml for machine-specific overrides (gitignored)

allowed_groups:
  - patching_group
  - webservers
  - db_servers
  - dev_test_hosts

playbook_dir: /home/debabrata/Downloads/ansible-log-mcp/playbooks
playbook_file: logscan.yml
health_playbook_file: health_check.yml
inventory_path: /home/debabrata/Downloads/ansible-log-mcp/playbooks/inventory/hosts.ini

